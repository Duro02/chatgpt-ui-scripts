<!doctype html>
<html lang="zh-CN" class="chatgpt-theme" data-theme="dark"><meta charset="utf-8"><title>Dots 对话导航 · 结构演示</title>
<style>
:root{--color-text-primary:#eeeae2;--color-text-tertiary:#969187;--color-surface-elevated-secondary:#302f2c;--color-border:#ffffff22;color-scheme:dark;--page:#20201e;--user:#343330}
:root:not([data-theme="dark"]){--color-text-primary:#292722;--color-text-tertiary:#7f7a70;--color-surface-elevated-secondary:#f3f0e9;--color-border:#29272222;color-scheme:light;--page:#f7f5ef;--user:#e8e3d8}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--color-text-primary);font:15px/1.7 system-ui}
header{height:64px;display:flex;align-items:center;gap:16px;padding:12px 28px;overflow-x:auto;white-space:nowrap}h1{font-size:16px;margin:0}button{cursor:pointer;font:inherit;padding:5px 12px}a{color:inherit}
.messages-scroll{height:calc(100vh - 160px);overflow-y:auto;overflow-anchor:none}.message-list{width:min(760px,calc(100% - 120px));margin:auto}.message-row{padding:18px 0;min-height:150px}.message-row.self{margin-left:80px}.self .message-text{padding:12px 18px;border-radius:18px;background:var(--user)}.message-row:not(.self) .message-text{color:var(--color-text-tertiary)}time{font-size:11px;opacity:.5}footer{height:96px;padding:15px max(60px,calc((100vw - 760px)/2))}textarea{width:100%;height:55px;border:0;border-radius:20px;padding:15px;font:inherit;color:inherit;background:var(--user)}
#profile-anchor{position:fixed;right:8px;top:60px;bottom:100px;width:min(300px,calc(100vw - 16px));z-index:100;pointer-events:none}
.profile-card{height:100%;overflow:auto;padding:20px;background:var(--color-surface-elevated-secondary);border:1px solid var(--color-border);border-radius:14px;box-shadow:0 12px 40px #0004;pointer-events:auto}.profile-card h2{font-size:16px;margin:0 0 24px}.profile-card h3{font-size:13px;margin-top:24px}.profile-card p{color:var(--color-text-tertiary);font-size:13px}.profile-close{float:right;padding:0 6px}
</style>
<header><h1>Dots 消息结构 · 导航演示</h1><button id="profile-toggle">Dot 个人资料</button><button id="expand">展开预览与搜索</button><button id="reset">重置演示</button><button id="theme">切换明暗</button><a href="/tests/conversation-rail.browser.html">完整回归测试</a></header>
<main class="thread-pane"><div class="messages-scroll" data-role="messages-scroll"><div class="message-list"></div></div><div id="profile-anchor" class="right-0 top-(--thread-floating-content-top-inset)"></div></main>
<footer><textarea aria-label="演示草稿">Dots 演示草稿：预览不移动正文，点击节点才跳转</textarea></footer>
<script>window.module={exports:{}};</script><script src="../../chatgpt-conversation-rail.user.js"></script>
<script>
const railAPI=window.module.exports;delete window.module;let demoRail;
const list=document.querySelector('.message-list'),scroll=document.querySelector('.messages-scroll');
function reset(){closeProfile();demoRail?.stop();list.replaceChildren();const topics=['历史恢复与缓存','节点高亮与跳转','搜索面板与预览','会话隔离','轻量性能'];
for(let i=0;i<40;i++)for(const self of [true,false]){const article=document.createElement('article');article.className='message-row'+(self?' self':'');article.dataset.messageId=`demo~demo~CalpicoMessage~${self?'user':'reply'}-${i}`;const body=document.createElement('div');body.className='message-body';body.dataset.messageId=article.dataset.messageId;const text=document.createElement('div');text.className='message-text';text.textContent=self?`第 ${i+1} 次提问：${topics[i%topics.length]}，怎样让 Dots 的长对话查找更顺手？`:`第 ${i+1} 条回答：按消息 ID 保留导航节点，按需读取摘要。预览和搜索复用卡片组件，浏览时不滚动正文，点击后才定位。`;body.append(text);const time=document.createElement('time');time.textContent='12:00';article.append(body,time);list.append(article);}
scroll.scrollTop=600;demoRail=railAPI.start(document,{storage:null});}
function closeProfile(){const panel=document.querySelector('[data-orbit-profile]');if(panel){panel.dataset.state='closed';panel.remove();}document.querySelector('#profile-toggle').setAttribute('aria-pressed','false');}
document.querySelector('#profile-toggle').onclick=()=>{
 if(document.querySelector('[data-orbit-profile]')){closeProfile();return;}
 const panel=document.createElement('div');panel.className='profile-card';panel.dataset.orbitProfile='true';panel.dataset.state='open';panel.setAttribute('role','dialog');panel.setAttribute('aria-labelledby','profile-title');
 panel.innerHTML='<button class="profile-close" aria-label="关闭个人资料">×</button><h2 id="profile-title">你的 Dot 的个人资料</h2><h3>Dot</h3><p>正在思考</p><h3>电脑</h3><p>已就绪</p><h3>近期活动</h3><p>长对话导航演示</p><h3>输出内容</h3><p>演示文件.txt</p><p>点击面板外或按 Esc 关闭</p>';
 panel.querySelector('button').onclick=closeProfile;document.querySelector('#profile-anchor').append(panel);document.querySelector('#profile-toggle').setAttribute('aria-pressed','true');
};
document.addEventListener('pointerdown',event=>{if(document.querySelector('[data-orbit-profile]')&&!document.querySelector('#profile-anchor').contains(event.target)&&!document.querySelector('#profile-toggle').contains(event.target))closeProfile();});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeProfile();});
document.querySelector('#reset').onclick=reset;
document.querySelector('#theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
document.querySelector('#expand').onclick=()=>{const root=document.querySelector('#duro-conversation-rail').shadowRoot,nav=root.querySelector('nav'),panel=root.querySelector('.preview');nav.dispatchEvent(new PointerEvent('pointerenter'));root.querySelector('.mark[data-key="message:demo~demo~CalpicoMessage~user-8"]').dispatchEvent(new PointerEvent('pointerover',{bubbles:true}));nav.dispatchEvent(new PointerEvent('pointerleave',{relatedTarget:panel}));panel.dispatchEvent(new PointerEvent('pointerenter'));root.querySelector('.search-toggle').click();root.querySelector('.search-input').value='缓存';root.querySelector('.search-form').requestSubmit();for(let i=0;i<3;i++)root.querySelector('.search-list').dispatchEvent(new WheelEvent('wheel',{deltaY:120,bubbles:true,composed:true,cancelable:true}));};
reset();
</script></html>
