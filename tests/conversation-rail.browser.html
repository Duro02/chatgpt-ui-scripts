<!doctype html>
<html lang="zh-CN" class="dark"><meta charset="utf-8"><title>对话导航 · 浏览器验证</title>
<style>
  :root{--text-primary:#eeeae2;--text-tertiary:#969187;--bg-elevated-primary:#302f2c;--border-light:#ffffff22;color-scheme:dark}
  :root{--fixture-page:#20201e;--fixture-header:#181817;--fixture-user:#2e2c27;--fixture-answer:#d6d1c5;--fixture-input:#30302b;--fixture-rule:#ffffff10}
  :root:not(.dark){--fixture-page:#f7f5ef;--fixture-header:#ebe7df;--fixture-user:#e8e3d8;--fixture-answer:#625e55;--fixture-input:#e7e2d8;--fixture-rule:#29272218}
  *{box-sizing:border-box}body{margin:0;background:var(--fixture-page);color:var(--text-primary);font:15px/1.7 system-ui}
  header{height:64px;display:flex;align-items:center;gap:18px;padding:10px 28px;background:var(--fixture-header)}
  header{overflow-x:auto;white-space:nowrap}header>*{flex-shrink:0}
  button{cursor:pointer;font:inherit;padding:5px 12px}h1{font-size:16px;margin:0}
  #scroll{height:calc(100vh - 160px);overflow-y:auto;position:relative;overflow-anchor:none}
  #content{width:min(760px,calc(100% - 120px));margin:0 auto}
  .turn{padding:24px 0;min-height:180px;border-bottom:1px solid var(--fixture-rule)}
  [data-user-message-bubble]{background:var(--fixture-user);border-radius:18px;padding:12px 18px;margin-left:80px}
  .markdown{font-family:Georgia,serif;padding:12px 0;color:var(--fixture-answer)}
  footer{height:96px;padding:12px max(80px,calc((100vw - 760px)/2));background:var(--fixture-page)}
  textarea{width:100%;height:55px;border:0;border-radius:20px;padding:15px;font:inherit;background:var(--fixture-input);color:var(--text-primary)}
  #results{position:fixed;left:16px;top:80px;width:240px;background:var(--fixture-header);padding:12px;font:12px/1.5 monospace;max-height:70vh;overflow:auto;z-index:60}
  #results:empty{display:none}.sr-only{display:none}
</style>
<header><h1>对话导航 · 演示与测试</h1><button id="showsearch">展示搜索与预览</button><button id="demo">展示长对话</button><button id="light">切换明暗</button><button id="persist">验证缓存与按需加载</button><button id="panel">验证七节点预览</button><button id="search">验证左侧搜索</button><button id="dots">验证 Dots 适配</button><button id="all">运行全部回归</button><button id="run">运行浏览器验证</button><button id="virtual">验证虚拟列表</button><button id="railscroll">验证长列表滚动</button><button id="animation">验证焦点动画</button><button id="selection">验证跳转高亮</button><button id="latest">验证最新节点保留</button><button id="currentending">验证当前末尾</button><button id="routeisolation">验证会话隔离</button><button id="hydration">验证刷新与历史入口</button><button id="preview">验证摘要</button></header>
<div id="scroll"><main id="content" data-thread-find-target="conversation"></main></div>
<footer><textarea aria-label="草稿">测试草稿：索引和跳转应保留这段输入</textarea></footer><pre id="results"></pre>
<script>window.module={exports:{}};</script><script src="../chatgpt-conversation-rail.user.js"></script>
<script>
const api=window.module.exports;delete window.module;
let controller, virtualListener;
const scroll=document.querySelector('#scroll'), content=document.querySelector('#content'), results=document.querySelector('#results');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function waitUntil(predicate,timeout=5000){const deadline=performance.now()+timeout;while(!predicate()&&performance.now()<deadline)await sleep(50);}
function turn(i,legacy=false){const el=document.createElement('div');el.className='turn';
  if(legacy){el.dataset.testid='conversation-turn-'+(i*2);el.dataset.turn='user';}
  else el.dataset.turnKey='message-'+i;
  el.innerHTML='<h4 class="sr-only">你说：</h4><div data-user-message-bubble="true">第 '+(i+1)+' 轮：长期执行中，哪些变化需要重新理解任务？</div><div class="markdown"><p>常规步骤由固定规则执行。新的目标或授权超出原规则时，再重新确定方案。这是用于验证导航的示例内容。</p></div>';return el;}
function setup(n,{virtual=false,reverse=false,legacy=false,omitTailWhileIndexing=false}={}){
  scroll.removeAttribute('data-role');
  controller?.stop();if(content.parentElement!==scroll){scroll.append(content);window.scrollTo(0,0);}if(virtualListener)scroll.removeEventListener('scroll',virtualListener);virtualListener=null;
  content.replaceChildren();content.dataset.audit='';scroll.style.display=reverse?'flex':'block';scroll.style.flexDirection=reverse?'column-reverse':'';
  content.style.flexShrink=reverse?'0':'';content.style.height='';scroll.scrollTop=0;
  if(virtual){content.style.height=(n*220)+'px';let first=-1;
    virtualListener=()=>{const max=scroll.scrollHeight-scroll.clientHeight;const pos=reverse?max+scroll.scrollTop:scroll.scrollTop;
      const start=Math.max(0,Math.min(n-1,Math.floor(pos/220)-1));const signature=start+'-'+Boolean(omitTailWhileIndexing&&controller?.snapshot().indexing);if(signature===first)return;first=signature;content.dataset.audit+=start+',';
      const box=document.createElement('div');box.style.paddingTop=(start*220)+'px';
      for(let i=start;i<Math.min(n,start+7);i++){const el=turn(i);el.style.height='220px';el.style.minHeight='220px';if(omitTailWhileIndexing&&controller?.snapshot().indexing&&i>=n-3)el.replaceChildren();box.append(el);}content.replaceChildren(box);};
    scroll.addEventListener('scroll',virtualListener);virtualListener();
  }else{for(let i=0;i<n;i++)content.append(turn(i,legacy));}
  controller=api.start(document,{storage:null});return controller;
}
function log(message){results.textContent+=message+'\n';}
function check(condition,message){if(!condition)throw Error(message);log('PASS '+message);}
function shadow(){return document.querySelector('#duro-conversation-rail').shadowRoot;}
async function run(virtualOnly=false){results.textContent='';document.querySelector('#run').disabled=true;
  try{
    let c;
    if(!virtualOnly){
    c=setup(1000);await sleep(400);
    check(c.snapshot().count===1000,'1,000 轮索引');check(c.snapshot().mountedMarks<=52,'横线 DOM 有界（≤52）');
    await waitUntil(()=>c.stats.refreshes>=2);
    const before={...c.stats}, start=performance.now();
    for(let i=0;i<100;i++){scroll.scrollTop=i*300;await new Promise(requestAnimationFrame);}
    await sleep(250);const after={...c.stats};
    check(after.geometryReads===before.geometryReads,'连续滚动没有全量几何重测');
    check(after.refreshes===before.refreshes,'连续滚动没有重建索引');
    log('scroll wall time '+Math.round(performance.now()-start)+'ms; frames '+(after.scrollFrames-before.scrollFrames));
    const p=content.querySelector('.markdown p').firstChild;const streamBefore=c.stats.refreshes;
    for(let i=0;i<1000;i++)p.data='流式输出 '+i;
    await sleep(400);check(c.stats.refreshes-streamBefore<=2,'1,000 次文本更新不反复扫描');
    const count=c.snapshot().count;content.append(turn(1000));await sleep(400);
    check(c.snapshot().count===count+1,'新提问增量加入');
    shadow().querySelector('.mark[data-key]').focus();await sleep(30);check(!shadow().querySelector('.preview').hidden,'键盘预览');
    shadow().querySelector('.mark[data-key]').dispatchEvent(new KeyboardEvent('keydown',{key:'End',bubbles:true}));
    check(shadow().activeElement.dataset.key==='turn:message-1000','虚拟导航键盘 End');
    shadow().activeElement.click();await sleep(800);
    check(Math.abs(scroll.scrollTop-(scroll.scrollHeight-scroll.clientHeight))<4&&content.lastElementChild.getBoundingClientRect().top<scroll.getBoundingClientRect().bottom,'末尾节点可见（尊重滚动边界）');
    check(document.querySelector('textarea').value.includes('测试草稿'),'草稿保留');
    history.pushState({},'',location.pathname+'?route-test'); // same pathname should preserve index
    await sleep(250);check(c.snapshot().count===1001,'查询参数不清空会话');
    history.pushState({},'', '/tests/another-conversation');content.replaceChildren(turn(5000),turn(5001));await sleep(500);
    check(c.snapshot().count===2,'切换会话清理旧索引');
    history.replaceState({},'', '/tests/conversation-rail.browser.html');
    }
    c=setup(80,{virtual:true,reverse:true});await sleep(400);
    const initialCount=c.snapshot().count;check(initialCount<80,'新版虚拟列表只挂载附近消息');
    const saved=scroll.scrollTop;shadow().querySelector('.index').click();
    await waitUntil(()=>!c.snapshot().indexing,125000);
    await sleep(800);
    if(c.snapshot().count!==80){log('Missing: '+Array.from({length:80},(_,i)=>'turn:message-'+i).filter(key=>!c.snapshot().entries.some(item=>item.key===key)).join(','));log('Mount ranges: '+content.dataset.audit);}
    check(c.snapshot().count===80,'负 scrollTop 虚拟列表全量索引');
    check(Math.abs(scroll.scrollTop-saved)<5,'索引完成恢复原位置');
    const reads=c.stats.refreshes;await sleep(500);check(c.stats.refreshes===reads,'空闲时没有轮询扫描');
    const mark=shadow().querySelector('.mark[data-key]');mark.focus();mark.dispatchEvent(new KeyboardEvent('keydown',{key:'Home',bubbles:true}));
    shadow().activeElement.click();await sleep(2000);
    const first=content.querySelector('[data-turn-key="message-0"]');
    check(first&&Math.abs(first.getBoundingClientRect().top-scroll.getBoundingClientRect().top)<4,'跳转已卸载节点并校准');
    shadow().querySelector('.index').click();await sleep(600);document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await sleep(500);
    check(!c.snapshot().indexing,'索引可取消');
    c=setup(3,{legacy:true});await sleep(400);check(c.snapshot().count===3,'旧版 conversation-turn 兼容');
    const response=content.querySelector('.markdown');response.className='';response.setAttribute('data-chatgpt-search-unit-key','fallback-turn-0:2:assistant');response.textContent='新版回答摘要验证';
    shadow().querySelector('.mark[data-key]').focus();check(shadow().querySelector('.answer').textContent==='新版回答摘要验证','新版回答摘要标记兼容');
    c=setup(8);const loader=document.createElement('div');loader.innerHTML='<div role="status">正在加载更早的消息…</div>';content.prepend(loader);
    setTimeout(()=>{for(let i=7;i>=0;i--)content.insertBefore(turn(200+i),loader.nextSibling);loader.remove();},900);
    shadow().querySelector('.index').click();await waitUntil(()=>!c.snapshot().indexing,125000);await sleep(500);
    check(c.snapshot().count===16,'索引等待服务器分页完成');
    c.stop();scroll.after(content);scroll.style.display='none';content.replaceChildren();for(let i=0;i<20;i++)content.append(turn(i));
    c=api.start(document,{storage:null});await sleep(400);
    const navRect=shadow().querySelector('nav').getBoundingClientRect();check(navRect.top>=0&&navRect.bottom<innerHeight,'页面根滚动容器布局');
    shadow().querySelector('.mark[data-key="turn:message-10"]').click();await sleep(800);
    check(Math.abs(content.querySelector('[data-turn-key="message-10"]').getBoundingClientRect().top-24)<4,'页面根滚动容器跳转');
    c.stop();content.append(turn(99));await sleep(300);check(!document.getElementById('duro-conversation-rail'),'卸载后释放观察器和 UI');
    log('ALL TESTS PASSED');
  }catch(e){log('FAIL '+e.stack);}finally{document.querySelector('#run').disabled=false;}
}
async function persistenceRegression(){
  results.textContent='';
  const savedPath=location.pathname, thread='persistence-'+Date.now();
  const pendingTimers=new Set();let pagingListener=null;
  const later=(fn,ms)=>{const timer=setTimeout(()=>{pendingTimers.delete(timer);fn();},ms);pendingTimers.add(timer);};
  const cleanTimers=()=>{for(const timer of pendingTimers)clearTimeout(timer);pendingTimers.clear();};
  try {
    controller?.stop();history.replaceState({},'', '/c/'+thread);
    setup(40);controller.stop();let c=controller=api.start(document);
    await waitUntil(()=>c.stats.refreshes>=2);c.flush();
    check(JSON.parse(localStorage.getItem(api.cacheKey(thread))).entries.length===40,'保存全部节点 ID、顺序和短摘要');
    c.stop();let begin=30,requests=0,busy=false;
    function renderPage(){content.replaceChildren();if(begin>0){const loader=document.createElement('div');loader.innerHTML='<div role="status">正在加载更早的消息…</div>';content.append(loader);}for(let i=begin;i<40;i++)content.append(turn(i));}
    function page(){if(scroll.scrollTop>2||begin<=0||busy)return;busy=true;requests++;later(()=>{begin=Math.max(0,begin-5);busy=false;renderPage();scroll.scrollTop=0;later(page,400);},650);}
    renderPage();scroll.scrollTop=scroll.scrollHeight;c=controller=api.start(document);
    pagingListener=page;scroll.addEventListener('scroll',pagingListener);
    check(c.snapshot().count===40,'初始化立即恢复全部已缓存节点');
    check(shadow().querySelector('.index').hidden,'已完整缓存的索引不会因正文分页出现红线');
    check(shadow().querySelector('[data-unloaded]'),'尚未挂载的缓存节点显示较暗横线');
    const first=shadow().querySelector('.mark[data-key]');first.focus();first.dispatchEvent(new KeyboardEvent('keydown',{key:'Home',bubbles:true}));
    for(let i=0;i<18;i++)shadow().activeElement.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true}));
    shadow().activeElement.dispatchEvent(new PointerEvent('pointerover',{bubbles:true}));
    const cachedPanel=shadow().querySelector('.preview');cachedPanel.dispatchEvent(new PointerEvent('pointerenter'));
    check(cachedPanel.querySelector('[data-center]').dataset.key==='turn:message-18','未挂载缓存节点也可展开邻居预览');
    shadow().querySelector('.search-toggle').click();shadow().querySelector('.search-input').value='第 19 轮';shadow().querySelector('.search-form').requestSubmit();
    shadow().querySelector('.search-result[data-key="turn:message-18"]').click();check(c.snapshot().loadingTarget,'通过搜索结果点击缓存节点进入按需加载而非全量扫描');
    await waitUntil(()=>!c.snapshot().loadingTarget&&content.querySelector('[data-turn-key="message-18"]')&&Math.abs(content.querySelector('[data-turn-key="message-18"]').getBoundingClientRect().top-scroll.getBoundingClientRect().top-24)<4,15000);
    check(c.snapshot().activeKey==='turn:message-18'&&Math.abs(content.querySelector('[data-turn-key="message-18"]').getBoundingClientRect().top-scroll.getBoundingClientRect().top-24)<4,'逐批加载后精确定位并高亮目标');
    check(!cachedPanel.hidden&&shadow().querySelector('.search-dock').hasAttribute('data-results'),'按需加载目标过程中保留搜索结果');
    await sleep(900);check(requests===3&&begin===15,'找到目标即停止，不继续加载全部更早历史');
    check(c.snapshot().count===40,'按需加载保留最新缓存节点和总数');
    const saved=scroll.scrollTop;shadow().querySelector('.mark[data-key]').focus();shadow().activeElement.dispatchEvent(new KeyboardEvent('keydown',{key:'Home',bubbles:true}));shadow().activeElement.click();await sleep(60);
    document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await sleep(500);
    check(!c.snapshot().loadingTarget&&Math.abs(scroll.scrollTop-saved)<4,'Esc 取消按需加载并恢复阅读位置');
    cleanTimers();scroll.removeEventListener('scroll',pagingListener);pagingListener=null;c.stop();
    c=controller=api.start(document,{loadTimeout:1200});
    shadow().querySelector('.mark[data-key]').focus();shadow().activeElement.dispatchEvent(new KeyboardEvent('keydown',{key:'Home',bubbles:true}));shadow().activeElement.click();
    await waitUntil(()=>!c.snapshot().loadingTarget,5000);
    check(!c.snapshot().loadingTarget&&c.snapshot().count===40,'历史请求停滞时有限退出并保留缓存');
    c.stop();history.replaceState({},'', '/c/'+thread+'-other');content.replaceChildren(turn(500));
    c=controller=api.start(document);check(c.snapshot().count===1,'其他会话不会读入本会话缓存');c.stop();
    history.replaceState({},'', '/c/'+thread+'-blocked');
    c=controller=api.start(document,{storage:{getItem(){throw Error('storage denied');},setItem(){throw Error('quota');}}});c.flush();
    check(c.snapshot().count===1,'存储不可用时仍可使用本页导航');c.stop();
    log('ALL PERSISTENCE TESTS PASSED');
  }catch(e){log('FAIL '+e.stack);}finally{
    cleanTimers();if(pagingListener)scroll.removeEventListener('scroll',pagingListener);
    controller?.stop();history.replaceState({},'',savedPath);
    for(const id of [thread,thread+'-other',thread+'-blocked'])localStorage.removeItem(api.cacheKey(id));
  }
}
document.querySelector('#persist').onclick=persistenceRegression;
async function historyJumpRegression(){
  results.textContent='';
  const savedPath=location.pathname, scope='paged-jump-'+Date.now(), thread=`dots:/dots/home:${scope}~${scope}`;
  const timers=new Set();let listener=null, begin=30, requests=0, busy=false, c;
  const later=(fn,ms)=>{const timer=setTimeout(()=>{timers.delete(timer);fn();},ms);timers.add(timer);};
  const key=i=>`message:${scope}~${scope}~CalpicoMessage~msg-${i}`;
  function renderPage(){
    const list=document.createElement('div');list.className='message-list';
    for(let i=begin;i<40;i++){
      const row=document.createElement('article');row.className='message-row self turn';row.dataset.messageId=key(i).slice(8);
      row.innerHTML=`<div class="message-text">第 ${i+1} 轮：多页历史跳转示例</div>`;list.append(row);
    }
    content.replaceChildren(list);
  }
  function page(){
    if(scroll.scrollTop>2||begin<=0||busy||!c?.snapshot().loadingTarget)return;
    busy=true;requests++;
    // No status sentinel, and one server page exceeds the old 2.4 s cutoff.
    later(()=>{const height=scroll.scrollHeight;begin=Math.max(0,begin-5);busy=false;
      const commit=()=>{renderPage();scroll.scrollTop+=scroll.scrollHeight-height;};
      if(requests===4){content.replaceChildren();later(commit,80);}else commit();
    },requests===2?3200:550);
  }
  try{
    setup(0);controller.stop();history.replaceState({},'', '/dots/home');scroll.dataset.role='messages-scroll';
    const records=Array.from({length:40},(_,i)=>({key:key(i),top:i*180,bottom:(i+1)*180,prompt:`第 ${i+1} 轮：多页历史跳转示例`,answer:''}));
    localStorage.setItem(api.cacheKey(thread),api.encodeSaved(thread,records,true,7200,true));
    renderPage();scroll.scrollTop=scroll.scrollHeight;c=controller=api.start(document,{loadTimeout:20000});
    listener=page;scroll.addEventListener('scroll',listener);
    check(c.snapshot().count===40,'Dots 初始化恢复跨六页的缓存节点');
    shadow().querySelector(`.mark[data-key="${key(3)}"]`).click();
    await waitUntil(()=>!c.snapshot().loadingTarget&&content.querySelector(`[data-message-id="${key(3).slice(8)}"]`),19000);
    const target=content.querySelector(`[data-message-id="${key(3).slice(8)}"]`);
    check(requests===6&&begin===0,'一次点击连续加载六页，慢页没有被提前判定为结束');
    check(target&&c.snapshot().selectedKey===key(3)&&c.snapshot().activeKey===key(3)&&Math.abs(target.getBoundingClientRect().top-scroll.getBoundingClientRect().top-24)<4,'加载后直接定位目标，不恢复旧节点或要求再点一次');
    await sleep(900);check(requests===6&&c.snapshot().activeKey===key(3),'目标定位完成后停止加载，焦点保持稳定');
    check(document.querySelector('textarea').value==='测试草稿：索引和跳转应保留这段输入','多页加载保留草稿');
    c.stop();begin=30;requests=0;busy=false;renderPage();scroll.scrollTop=scroll.scrollHeight;
    localStorage.setItem(api.cacheKey(thread),api.encodeSaved(thread,records,true,7200,true));
    c=controller=api.start(document,{loadTimeout:1200});shadow().querySelector(`.mark[data-key="${key(3)}"]`).click();
    await waitUntil(()=>!c.snapshot().loadingTarget,3000);
    check(!c.snapshot().loadingTarget&&requests>=1&&requests<6&&begin>0,'消息容器重挂载不重置整次跳转超时，失败仍有限退出');
    for(const timer of timers)clearTimeout(timer);timers.clear();scroll.removeEventListener('scroll',listener);listener=null;c.stop();
    begin=30;renderPage();scroll.scrollTop=scroll.scrollHeight;
    localStorage.setItem(api.cacheKey(thread),api.encodeSaved(thread,records,true,7200,true));
    c=controller=api.start(document,{loadTimeout:200});
    later(()=>{begin=0;renderPage();},150);shadow().querySelector(`.mark[data-key="${key(3)}"]`).click();
    await waitUntil(()=>!c.snapshot().loadingTarget&&c.snapshot().activeKey===key(3),1500);
    const finalTarget=content.querySelector(`[data-message-id="${key(3).slice(8)}"]`);
    check(finalTarget&&c.snapshot().selectedKey===key(3)&&Math.abs(finalTarget.getBoundingClientRect().top-scroll.getBoundingClientRect().top-24)<4,'目标在最后一次等待中到达，优先定位而不是恢复旧位置');
    log('ALL MULTIPAGE JUMP TESTS PASSED');
  }catch(e){log('FAIL '+e.stack);}finally{
    for(const timer of timers)clearTimeout(timer);if(listener)scroll.removeEventListener('scroll',listener);
    controller?.stop();scroll.removeAttribute('data-role');history.replaceState({},'',savedPath);localStorage.removeItem(api.cacheKey(thread));
  }
}
const historyJumpButton=document.createElement('button');historyJumpButton.id='historyjump';historyJumpButton.textContent='验证多页目标跳转';document.querySelector('#persist').after(historyJumpButton);historyJumpButton.onclick=historyJumpRegression;
async function railScrollRegression(){
  results.textContent='';
  try {
    const c=setup(1000);await sleep(400);
    const rail=shadow().querySelector('.scroller');const bodyStart=scroll.scrollTop;
    check(rail.scrollHeight>rail.clientHeight,'千轮节点列表有独立上下滚动范围');
    const first=shadow().querySelector('.mark[data-key]');first.focus();
    const start=rail.scrollTop,samples=[];
    first.dispatchEvent(new KeyboardEvent('keydown',{key:'End',bubbles:true}));
    for(let i=0;i<10;i++){await new Promise(requestAnimationFrame);samples.push(rail.scrollTop);}
    await waitUntil(()=>!c.snapshot().animating);
    const end=rail.scrollTop;
    check(matchMedia('(prefers-reduced-motion:reduce)').matches||samples.some(top=>top>start+1&&top<end-1),'跨越可见区域时列表平滑滚动');
    check(shadow().activeElement.dataset.key==='turn:message-999','键盘 End 可访问尚未渲染的最后节点');
    check(scroll.scrollTop===bodyStart,'浏览节点列表不会滚动正文');
